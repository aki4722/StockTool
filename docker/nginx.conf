server {
    listen 80 default_server;
    root /var/www/html;
    index index.php;

    # Docker DNS; resolve upstreams per request so nginx starts even if one is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Backend API (same paths the legacy frontend proxied)
    location ~ ^/(stock|stocks|health|api)($|/) {
        set $backend http://backend:5001;
        proxy_pass         $backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # memocrip app (separate compose project on the legacy network)
    location /memocrip/ {
        set $memocrip memocrip:3000;
        rewrite ^/memocrip/(.*)$ /$1 break;
        proxy_pass         http://$memocrip;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include              fastcgi_params;
        fastcgi_pass         127.0.0.1:9000;
        fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
